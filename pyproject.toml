[project]
name = "irms"
version = "0.1.0"
description = "iRMS Rule Agent: AMR 仓储项目任务流规则生成与沙箱验证 CLI 工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "claude-agent-sdk>=0.1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
irms = "irms.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irms"]
